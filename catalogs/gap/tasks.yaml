  hidden: hidden/gap-brief-python-metadata-2026
  packages: []
  oracle:
    excerpt: By supplying an admin username with an arbitrary API key the request was processed with admin
      privileges. While it would not enable existing release files to be modified in-place, it would enable
      an attacker to modify the URLs that are provided on python.org for each release file, including
      verification material URLs. There is no evidence this vulnerability was exploited after auditing
