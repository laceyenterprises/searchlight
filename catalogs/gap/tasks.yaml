  oracle:
    excerpt: "  - `StripeObject` no longer inherits from `dict`, so any `dict` methods will no longer\
      \ exist, including `.get()`, `.update()`, and notably, `.items()`.\n  - or convenience, it's still\
      \ possible to check presence with `'some_key' in some_obj` and check for equality between stripe\
      \ objects. But most key/value iteration needs an extra step\n  - To access the underlying data as\
      \ a `dict`, call `some_obj.to_dict()`, which recursively dumps all stripe-provided classes into\
      \ native Python types. This is a read-only view; changes to the output of `to_dict()` won't affect\
      \ the original object. \n  - Write operations can still be done with dot notation (`some_obj.val\
      \ = 123`) or bracket notation (`some_obj[\"val\"] = 123`). Do that instead of trying to interact\
      \ with the underlying data store, as the implementation is considered private and may change without\
      \ warning in the future."
    source_url: https://github.com/stripe/stripe-python/releases/tag/v15.0.0
    retrieved_at: '2026-10-02'
