    # the disjoint input bucket; cached_input is cache hits/refreshes.
    input_usd_per_mtok: 4.00
    cache_write_5m_usd_per_mtok: 5.00
    cache_write_1h_usd_per_mtok: 8.00
    cached_input_usd_per_mtok: 0.20
    output_usd_per_mtok: 20.00
    rate_basis: published_list_price
    source: https://docs.anthropic.com/en/docs/about-claude/pricing
    as_of: "2026-09-29"
  claude-fable-5:
