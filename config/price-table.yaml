    as_of: "2026-09-29"
  gpt-5.6-sol:
    # The model page lists these rates as a promotion running at least
    # through 2026-11-21; re-read the page after that date. It states no
    # cache-write dollar figure, so none is recorded here.
    max_short_context_input_tokens: 272000
    input_usd_per_mtok: 4.00
    cached_input_usd_per_mtok: 0.40
    output_usd_per_mtok: 20.00
    rate_basis: published_list_price
    source: https://developers.openai.com/api/docs/models/gpt-5.6-sol
    as_of: "2026-09-29"
  gpt-5.6-terra:
    max_short_context_input_tokens: 272000
    input_usd_per_mtok: 2.00
    cached_input_usd_per_mtok: 0.20
    output_usd_per_mtok: 12.00
    rate_basis: published_list_price
    source: https://developers.openai.com/api/docs/models/gpt-5.6-terra
    as_of: "2026-09-29"
  gpt-5.6-luna:
    max_short_context_input_tokens: 272000
    input_usd_per_mtok: 0.20
    cached_input_usd_per_mtok: 0.02
    output_usd_per_mtok: 1.20
    rate_basis: published_list_price
