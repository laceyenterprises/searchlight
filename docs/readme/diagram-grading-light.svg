<svg xmlns="http://www.w3.org/2000/svg" class="wide rd" viewBox="0 0 960 828" width="960" height="828" role="img" aria-labelledby="fl-grading-readme-t fl-grading-readme-d"><style>:root{--paper:#FFFFFF;--soft:#F4F6F9;--raised:#FFFFFF;--rule:#E3E7EC;--ink:#111111;--ink-2:#4F5761;--muted:#5F6873;--blue:#007BFF;--blue-ink:#0057B3;--blue-soft:#EAF3FF;--on-blue:#FFFFFF;--go:#00A86B;--go-ink:#007A4D;--red:#E5202E;--red-ink:#B3121C;--amber:#F5B700;--amber-ink:#8A5A00;--amber-soft:#FFF6D9;--night:#0C0F13;--night-2:#161B22;--night-rule:#262C35;--night-fg:#F2F4F7;--night-mute:#9AA3AF;--sl-accent:var(--blue);--sl-go:var(--go);--sl-red:var(--red);--sl-amber:var(--amber);--viz-track:#EEF0F3;--viz-interval:#9EC5F4;--viz-other:#B4BBC5;--viz-ref:#3A414B;--font-body:Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;--font-display:Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;--font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:80px;--radius-xs:3px;--radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:18px;--wrap:1120px;--font-body:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;--font-display:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;--font-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace}.nd{fill:var(--raised);stroke:var(--rule);stroke-width:1.5}.nd.q{fill:var(--blue-soft);stroke:var(--blue)}.t{font:650 17px var(--font-body);fill:var(--ink)}.b{font:400 16px var(--font-body);fill:var(--ink-2)}.b.strong{font-weight:650;fill:var(--ink)}.e{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round}.e.r{stroke-dasharray:6 5}.life{fill:none;stroke:var(--rule);stroke-width:2;stroke-dasharray:4 6}.ah{fill:var(--muted)}.el{font:500 15px var(--font-body);fill:var(--ink-2)}use{color:var(--ink)}use{color:var(--ink)}.rd .t{font-size:18px}.rd .b{font-size:17px}.rd .m{font-size:17px}.rd .el{font-size:17px}.rd .gl{font-size:17px}</style><defs><symbol id="brief" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><rect x="4.5" y="3" width="15" height="18" rx="2"/><path d="M8 7.5h8M8 11h8M8 14.5h4"/><path d="M13 17.5l1.6 1.6 3-3" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M3 4.5h18l-7 8v6l-4 2v-8z"/><path d="M6.5 8.5h11" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="judge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M12 3v18M7 21h10M4 6.5h16"/><path d="M4 6.5L1.5 13a3 3 0 0 0 5 0zM20 6.5L17.5 13a3 3 0 0 0 5 0z"/><circle cx="12" cy="4" r="1.8" stroke="none" style="fill:var(--sl-accent, currentColor)"/></symbol><symbol id="source" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M5 2.5h10l4 4v15H5z"/><path d="M15 2.5v4h4"/><path d="M8.5 12h7" style="stroke:var(--sl-accent, currentColor)"/><path d="M8.5 16h7"/></symbol></defs><title id="fl-grading-readme-t">How answers are graded</title><desc id="fl-grading-readme-d">Agent answer to Schema validator: JSON deliverable (brief, claims, citations); Schema validator to Agent answer: reject malformed answers; Agent answer to Source capture: cited URLs; Source capture to Judge 1 Claude Code: readable source text + rubric (blinded to the search setup); Source capture to Judge 2 Codex, gap bench: same inputs; Judge 1 Claude Code to Agent answer: key-fact recall, unsupported claims, decision; Judge 2 Codex, gap bench to Agent answer: independent labels, agreement recorded. Pass = right decision AND recall ≥ 0.7 AND unsupported ≤ 0.25</desc><defs><marker id="fl-grading-readme-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="nd " x="12.0" y="20.0" width="171.2" height="138.0" rx="12"/><use href="#brief" x="26.0" y="34.0" width="26" height="26"/><text class="t" x="26.0" y="86.0">Agent answer</text><rect class="nd " x="203.2" y="20.0" width="171.2" height="138.0" rx="12"/><use href="#filter" x="217.2" y="34.0" width="26" height="26"/><text class="t" x="217.2" y="86.0">Schema</text><text class="t" x="217.2" y="110.0">validator</text><rect class="nd " x="394.4" y="20.0" width="171.2" height="138.0" rx="12"/><use href="#source" x="408.4" y="34.0" width="26" height="26"/><text class="t" x="408.4" y="86.0">Source capture</text><rect class="nd " x="585.6" y="20.0" width="171.2" height="138.0" rx="12"/><use href="#judge" x="599.6" y="34.0" width="26" height="26"/><text class="t" x="599.6" y="86.0">Judge 1</text><text class="b" x="599.6" y="114.0">Claude Code</text><rect class="nd " x="776.8" y="20.0" width="171.2" height="138.0" rx="12"/><use href="#judge" x="790.8" y="34.0" width="26" height="26"/><text class="t" x="790.8" y="86.0">Judge 2</text><text class="b" x="790.8" y="114.0">Codex, gap</text><text class="b" x="790.8" y="138.0">bench</text><path class="life" d="M97.6 158.0 V738.0"/><path class="life" d="M288.8 158.0 V738.0"/><path class="life" d="M480.0 158.0 V738.0"/><path class="life" d="M671.2 158.0 V738.0"/><path class="life" d="M862.4 158.0 V738.0"/><text class="el" x="193.2" y="211.0" text-anchor="middle">JSON deliverable</text><text class="el" x="193.2" y="235.0" text-anchor="middle">(brief, claims,</text><text class="el" x="193.2" y="259.0" text-anchor="middle">citations)</text><path class="e" d="M103.6 266.0 H280.8" marker-end="url(#fl-grading-readme-a)"/><text class="el" x="193.2" y="317.0" text-anchor="middle">reject malformed</text><text class="el" x="193.2" y="341.0" text-anchor="middle">answers</text><path class="e r" d="M282.8 348.0 H105.6" marker-end="url(#fl-grading-readme-a)"/><text class="el" x="288.8" y="399.0" text-anchor="middle">cited URLs</text><path class="e" d="M103.6 406.0 H472.0" marker-end="url(#fl-grading-readme-a)"/><text class="el" x="575.6" y="457.0" text-anchor="middle">readable source</text><text class="el" x="575.6" y="481.0" text-anchor="middle">text + rubric</text><text class="el" x="575.6" y="505.0" text-anchor="middle">(blinded to the</text><text class="el" x="575.6" y="529.0" text-anchor="middle">search setup)</text><path class="e" d="M486.0 536.0 H663.2" marker-end="url(#fl-grading-readme-a)"/><text class="el" x="671.2" y="587.0" text-anchor="middle">same inputs</text><path class="e" d="M486.0 594.0 H854.4" marker-end="url(#fl-grading-readme-a)"/><text class="el" x="384.4" y="645.0" text-anchor="middle">key-fact recall, unsupported claims, decision</text><path class="e r" d="M665.2 652.0 H105.6" marker-end="url(#fl-grading-readme-a)"/><text class="el" x="480.0" y="703.0" text-anchor="middle">independent labels, agreement recorded</text><path class="e r" d="M856.4 710.0 H105.6" marker-end="url(#fl-grading-readme-a)"/><rect class="nd q" x="12" y="754.0" width="936" height="48.0" rx="12"/><text class="b strong" x="480.0" y="786.0" text-anchor="middle">Pass = right decision AND recall ≥ 0.7 AND unsupported ≤ 0.25</text></svg>
