<svg xmlns="http://www.w3.org/2000/svg" class="wide rd" viewBox="0 0 840 658" width="840" height="658" role="img" aria-labelledby="t d"><style>:root{--paper:#FFFFFF;--soft:#F4F6F9;--raised:#FFFFFF;--rule:#E3E7EC;--ink:#111111;--ink-2:#4F5761;--muted:#5F6873;--blue:#007BFF;--blue-ink:#0057B3;--blue-soft:#EAF3FF;--on-blue:#FFFFFF;--go:#00A86B;--go-ink:#007A4D;--red:#E5202E;--red-ink:#B3121C;--amber:#F5B700;--amber-ink:#8A5A00;--amber-soft:#FFF6D9;--night:#0C0F13;--night-2:#161B22;--night-rule:#262C35;--night-fg:#F2F4F7;--night-mute:#9AA3AF;--sl-accent:var(--blue);--sl-go:var(--go);--sl-red:var(--red);--sl-amber:var(--amber);--viz-track:#EEF0F3;--viz-interval:#9EC5F4;--viz-other:#B4BBC5;--viz-ref:#3A414B;--font-body:Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;--font-display:Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;--font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:80px;--radius-xs:3px;--radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:18px;--wrap:1120px;--font-body:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;--font-display:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;--font-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace}.nd{fill:var(--raised);stroke:var(--rule);stroke-width:1.5}.grp{fill:none;stroke:var(--viz-other);stroke-width:1.5;stroke-dasharray:6 6}.gl{font:500 14px var(--font-mono);letter-spacing:.06em;fill:var(--muted)}.t{font:650 17px var(--font-body);fill:var(--ink)}.b{font:400 16px var(--font-body);fill:var(--ink-2)}.e{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round}.ah{fill:var(--muted)}.el{font:500 15px var(--font-body);fill:var(--ink-2)}.elb{fill:var(--paper)}use{color:var(--ink)}use{color:var(--ink)}.rd .t{font-size:18px}.rd .b{font-size:17px}.rd .m{font-size:17px}.rd .el{font-size:17px}.rd .gl{font-size:17px}</style><defs><symbol id="agent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M6 10l3 2.5L6 15"/><path d="M11 15h6" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="built-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><rect x="2.5" y="4" width="19" height="16" rx="2"/><circle cx="11" cy="11.5" r="3.5" style="stroke:var(--sl-accent, currentColor)"/><path d="M13.6 14.1l3 3" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="no-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.18 15.18L20.18 20.18" /><path d="M3.5 3.5l17 17" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="provider" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M6.5 9.5h11v4a5.5 5.5 0 0 1-11 0zM12 19v3"/><path d="M9 3v6.5M15 3v6.5" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="source" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M5 2.5h10l4 4v15H5z"/><path d="M15 2.5v4h4"/><path d="M8.5 12h7" style="stroke:var(--sl-accent, currentColor)"/><path d="M8.5 16h7"/></symbol></defs><title id="t">Exactly one search setup per run</title><desc id="d">The same agent, the same prompt: Claude Code (claude-opus-5-5) or Codex (gpt-6.1-sol) or Hermes Agent, Opencode or Pi on an OSS model. Each run gives it exactly one search setup: No search (memory alone), Built-in (the agent&#x27;s own), Brave (MCP server), Tavily (MCP server), Exa (MCP server), Parallel (hosted MCP), Firecrawl (MCP server), Perplexity (MCP server). The search gap bench adds two reference setups per task: floor, no search; ceiling, the answer excerpt in the prompt.</desc><defs><marker id="fl-setups-wide-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="nd " x="140.0" y="12.0" width="560.0" height="106.0" rx="12"/><use href="#agent" x="154.0" y="26.0" width="26" height="26"/><text class="t" x="190.0" y="45.0">The same agent, the same prompt</text><text class="b" x="154.0" y="78.0">Claude Code (claude-opus-5-5) or Codex (gpt-6.1-sol)</text><text class="b" x="154.0" y="102.0">or Hermes Agent, Opencode or Pi on an OSS model</text><path class="e" d="M420.0 118.0V172.0" marker-end="url(#fl-setups-wide-a)"/><rect class="elb" x="428.0" y="131.2" width="162.3" height="25.5" rx="4"/><text class="el" x="509.1" y="151.7" text-anchor="middle">only this changes</text><rect class="grp" x="12.0" y="174.0" width="816.0" height="295.0" rx="16"/><text class="gl" x="24.0" y="204.0">EXACTLY ONE PER RUN</text><rect class="nd " x="22.0" y="219.0" width="190.0" height="114.0" rx="12"/><use href="#no-search" x="36.0" y="233.0" width="26" height="26"/><text class="t" x="36.0" y="285.0">No search</text><text class="b" x="36.0" y="313.0">memory alone</text><rect class="nd " x="224.0" y="219.0" width="190.0" height="114.0" rx="12"/><use href="#built-in" x="238.0" y="233.0" width="26" height="26"/><text class="t" x="238.0" y="285.0">Built-in</text><text class="b" x="238.0" y="313.0">the agent&#x27;s own</text><rect class="nd " x="426.0" y="219.0" width="190.0" height="114.0" rx="12"/><use href="#provider" x="440.0" y="233.0" width="26" height="26"/><text class="t" x="440.0" y="285.0">Brave</text><text class="b" x="440.0" y="313.0">MCP server</text><rect class="nd " x="628.0" y="219.0" width="190.0" height="114.0" rx="12"/><use href="#provider" x="642.0" y="233.0" width="26" height="26"/><text class="t" x="642.0" y="285.0">Tavily</text><text class="b" x="642.0" y="313.0">MCP server</text><rect class="nd " x="22.0" y="345.0" width="190.0" height="114.0" rx="12"/><use href="#provider" x="36.0" y="359.0" width="26" height="26"/><text class="t" x="36.0" y="411.0">Exa</text><text class="b" x="36.0" y="439.0">MCP server</text><rect class="nd " x="224.0" y="345.0" width="190.0" height="114.0" rx="12"/><use href="#provider" x="238.0" y="359.0" width="26" height="26"/><text class="t" x="238.0" y="411.0">Parallel</text><text class="b" x="238.0" y="439.0">hosted MCP</text><rect class="nd " x="426.0" y="345.0" width="190.0" height="114.0" rx="12"/><use href="#provider" x="440.0" y="359.0" width="26" height="26"/><text class="t" x="440.0" y="411.0">Firecrawl</text><text class="b" x="440.0" y="439.0">MCP server</text><rect class="nd " x="628.0" y="345.0" width="190.0" height="114.0" rx="12"/><use href="#provider" x="642.0" y="359.0" width="26" height="26"/><text class="t" x="642.0" y="411.0">Perplexity</text><text class="b" x="642.0" y="439.0">MCP server</text><rect class="grp" x="12.0" y="493.0" width="816.0" height="137.0" rx="16"/><text class="gl" x="24.0" y="523.0">THE SEARCH GAP BENCH ADDS, PER TASK</text><rect class="nd " x="22.0" y="538.0" width="392.0" height="82.0" rx="12"/><use href="#no-search" x="36.0" y="552.0" width="26" height="26"/><text class="t" x="72.0" y="571.0">Floor</text><text class="b" x="36.0" y="604.0">no search</text><rect class="nd " x="426.0" y="538.0" width="392.0" height="82.0" rx="12"/><use href="#source" x="440.0" y="552.0" width="26" height="26"/><text class="t" x="476.0" y="571.0">Ceiling</text><text class="b" x="440.0" y="604.0">the answer excerpt in the prompt</text></svg>
