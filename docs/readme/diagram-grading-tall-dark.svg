<svg xmlns="http://www.w3.org/2000/svg" class="tall rd" viewBox="0 0 360 744" width="360" height="744" role="img" aria-labelledby="fl-grading-readme-tall-t fl-grading-readme-tall-d"><style>:root{--paper:#0C0F13;--soft:#141920;--raised:#1B212A;--rule:#262C35;--ink:#F2F4F7;--ink-2:#B9C1CC;--muted:#939CAA;--blue:#3D9BFF;--blue-ink:#7DBBFF;--blue-soft:#0F2238;--on-blue:#06111F;--go:#2BD99A;--go-ink:#5BE3AE;--red:#FF4D4F;--red-ink:#FF8587;--amber:#FFC83D;--amber-ink:#FFD36B;--amber-soft:#2A2210;--night:#141920;--night-2:#1B212A;--night-rule:#2B323C;--night-fg:#F2F4F7;--night-mute:#9AA3AF;--sl-accent:var(--blue);--sl-go:var(--go);--sl-red:var(--red);--sl-amber:var(--amber);--viz-track:#1A2029;--viz-interval:#2A5D99;--viz-other:#56606D;--viz-ref:#B9C1CC;--font-body:Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;--font-display:Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;--font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:80px;--radius-xs:3px;--radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:18px;--wrap:1120px;--font-body:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;--font-display:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;--font-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace}.nd{fill:var(--raised);stroke:var(--rule);stroke-width:1.5}.nd.q{fill:var(--blue-soft);stroke:var(--blue)}.gl{font:500 14px var(--font-mono);letter-spacing:.06em;fill:var(--muted)}.t{font:650 17px var(--font-body);fill:var(--ink)}.b{font:400 16px var(--font-body);fill:var(--ink-2)}.b.strong{font-weight:650;fill:var(--ink)}.tall .t{font-size:16px}.tall .b{font-size:15px}.e{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round}.e.r{stroke-dasharray:6 5}.ah{fill:var(--muted)}use{color:var(--ink)}use{color:var(--ink)}.rd .t{font-size:16px}.rd .b{font-size:16px}.rd .m{font-size:16px}.rd .el{font-size:16px}.rd .gl{font-size:16px}</style><defs><symbol id="brief" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><rect x="4.5" y="3" width="15" height="18" rx="2"/><path d="M8 7.5h8M8 11h8M8 14.5h4"/><path d="M13 17.5l1.6 1.6 3-3" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M3 4.5h18l-7 8v6l-4 2v-8z"/><path d="M6.5 8.5h11" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="judge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M12 3v18M7 21h10M4 6.5h16"/><path d="M4 6.5L1.5 13a3 3 0 0 0 5 0zM20 6.5L17.5 13a3 3 0 0 0 5 0z"/><circle cx="12" cy="4" r="1.8" stroke="none" style="fill:var(--sl-accent, currentColor)"/></symbol><symbol id="source" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M5 2.5h10l4 4v15H5z"/><path d="M15 2.5v4h4"/><path d="M8.5 12h7" style="stroke:var(--sl-accent, currentColor)"/><path d="M8.5 16h7"/></symbol></defs><title id="fl-grading-readme-tall-t">How answers are graded</title><desc id="fl-grading-readme-tall-d">Agent answer to Schema validator: JSON deliverable (brief, claims, citations); Schema validator to Agent answer: reject malformed answers; Agent answer to Source capture: cited URLs; Source capture to Judge 1 Claude Code: readable source text + rubric (blinded to the search setup); Source capture to Judge 2 Codex, gap bench: same inputs; Judge 1 Claude Code to Agent answer: key-fact recall, unsupported claims, decision; Judge 2 Codex, gap bench to Agent answer: independent labels, agreement recorded. Pass = right decision AND recall ≥ 0.7 AND unsupported ≤ 0.25</desc><d