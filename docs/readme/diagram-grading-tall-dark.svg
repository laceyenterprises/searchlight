<svg xmlns="http://www.w3.org/2000/svg" class="tall" viewBox="0 0 360 1037" width="360" height="1037" role="img" aria-labelledby="fl-grading-tall-t fl-grading-tall-d"><style>:root{--paper:#0C0F13;--soft:#141920;--raised:#1B212A;--rule:#262C35;--ink:#F2F4F7;--ink-2:#B9C1CC;--muted:#939CAA;--blue:#3D9BFF;--blue-ink:#7DBBFF;--blue-soft:#0F2238;--on-blue:#06111F;--go:#2BD99A;--go-ink:#5BE3AE;--red:#FF4D4F;--red-ink:#FF8587;--amber:#FFC83D;--amber-ink:#FFD36B;--amber-soft:#2A2210;--night:#141920;--night-2:#1B212A;--night-rule:#2B323C;--night-fg:#F2F4F7;--night-mute:#9AA3AF;--sl-accent:var(--blue);--sl-go:var(--go);--sl-red:var(--red);--sl-amber:var(--amber);--viz-track:#1A2029;--viz-interval:#2A5D99;--viz-other:#56606D;--viz-ref:#B9C1CC;--font-body:Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;--font-display:Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;--font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:80px;--radius-xs:3px;--radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:18px;--wrap:1120px;--font-body:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;--font-display:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;--font-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace}.nd{fill:var(--raised);stroke:var(--rule);stroke-width:1.5}.nd.q{fill:var(--blue-soft);stroke:var(--blue)}.gl{font:500 14px var(--font-mono);letter-spacing:.06em;fill:var(--muted)}.t{font:650 17px var(--font-body);fill:var(--ink)}.b{font:400 16px var(--font-body);fill:var(--ink-2)}.b.strong{font-weight:650;fill:var(--ink)}.tall .t{font-size:16px}.tall .b{font-size:15px}.e{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round}.e.r{stroke-dasharray:6 5}.ah{fill:var(--muted)}use{color:var(--ink)}use{color:var(--ink)}</style><defs><symbol id="brief" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><rect x="4.5" y="3" width="15" height="18" rx="2"/><path d="M8 7.5h8M8 11h8M8 14.5h4"/><path d="M13 17.5l1.6 1.6 3-3" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M3 4.5h18l-7 8v6l-4 2v-8z"/><path d="M6.5 8.5h11" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="judge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M12 3v18M7 21h10M4 6.5h16"/><path d="M4 6.5L1.5 13a3 3 0 0 0 5 0zM20 6.5L17.5 13a3 3 0 0 0 5 0z"/><circle cx="12" cy="4" r="1.8" stroke="none" style="fill:var(--sl-accent, currentColor)"/></symbol><symbol id="source" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M5 2.5h10l4 4v15H5z"/><path d="M15 2.5v4h4"/><path d="M8.5 12h7" style="stroke:var(--sl-accent, currentColor)"/><path d="M8.5 16h7"/></symbol></defs><title id="fl-grading-tall-t">How answers are graded</title><desc id="fl-grading-tall-d">Agent answer to Schema validator: JSON deliverable (brief, claims, citations); Schema validator to Agent answer: reject malformed answers; Agent answer to Source capture: cited URLs; Source capture to Judge 1 Claude Code: readable source text + rubric (blinded to the search setup); Source capture to Judge 2 Codex, gap bench: same inputs; Judge 1 Claude Code to Agent answer: key-fact recall, unsupported claims, decision; Judge 2 Codex, gap bench to Agent answer: independent labels, agreement recorded. Pass = right decision AND recall ≥ 0.7 AND unsupported ≤ 0.25</desc><defs><marker id="fl-grading-tall-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="nd" x="10" y="20.0" width="340" height="130.0" rx="12"/><text class="gl" x="24" y="52.0">1</text><use href="#brief" x="46.0" y="34.0" width="20" height="20"/><text class="t" x="74.0" y="50.0">Agent answer</text><path class="e" d="M50.0 56.0 V70.0 H68.0" marker-end="url(#fl-grading-tall-a)"/><use href="#filter" x="76.0" y="62.0" width="20" height="20"/><text class="t" x="104.0" y="78.0">Schema validator</text><text class="b" x="24" y="108.0">JSON deliverable (brief, claims,</text><text class="b" x="24" y="129.0">citations)</text><rect class="nd" x="10" y="162.0" width="340" height="109.0" rx="12"/><text class="gl" x="24" y="194.0">2</text><use href="#filter" x="46.0" y="176.0" width="20" height="20"/><text class="t" x="74.0" y="192.0">Schema validator</text><path class="e r" d="M50.0 198.0 V212.0 H68.0" marker-end="url(#fl-grading-tall-a)"/><use href="#brief" x="76.0" y="204.0" width="20" height="20"/><text class="t" x="104.0" y="220.0">Agent answer</text><text class="b" x="24" y="250.0">reject malformed answers</text><rect class="nd" x="10" y="283.0" width="340" height="109.0" rx="12"/><text class="gl" x="24" y="315.0">3</text><use href="#brief" x="46.0" y="297.0" width="20" height="20"/><text class="t" x="74.0" y="313.0">Agent answer</text><path class="e" d="M50.0 319.0 V333.0 H68.0" marker-end="url(#fl-grading-tall-a)"/><use href="#source" x="76.0" y="325.0" width="20" height="20"/><text class="t" x="104.0" y="341.0">Source capture</text><text class="b" x="24" y="371.0">cited URLs</text><rect class="nd" x="10" y="404.0" width="340" height="130.0" rx="12"/><text class="gl" x="24" y="436.0">4</text><use href="#source" x="46.0" y="418.0" width="20" height="20"/><text class="t" x="74.0" y="434.0">Source capture</text><path class="e" d="M50.0 440.0 V454.0 H68.0" marker-end="url(#fl-grading-tall-a)"/><use href="#judge" x="76.0" y="446.0" width="20" height="20"/><text class="t" x="104.0" y="462.0">Judge 1</text><text class="b" x="24" y="492.0">readable source text + rubric</text><text class="b" x="24" y="513.0">(blinded to the search setup)</text><rect class="nd" x="10" y="546.0" width="340" height="109.0" rx="12"/><text class="gl" x="24" y="578.0">5</text><use href="#source" x="46.0" y="560.0" width="20" height="20"/><text class="t" x="74.0" y="576.0">Source capture</text><path class="e" d="M50.0 582.0 V596.0 H68.0" marker-end="url(#fl-grading-tall-a)"/><use href="#judge" x="76.0" y="588.0" width="20" height="20"/><text class="t" x="104.0" y="604.0">Judge 2</text><text class="b" x="24" y="634.0">same inputs</text><rect class="nd" x="10" y="667.0" width="340" height="130.0" rx="12"/><text class="gl" x="24" y="699.0">6</text><use href="#judge" x="46.0" y="681.0" width="20" height="20"/><text class="t" x="74.0" y="697.0">Judge 1</text><path class="e r" d="M50.0 703.0 V717.0 H68.0" marker-end="url(#fl-grading-tall-a)"/><use href="#brief" x="76.0" y="709.0" width="20" height="20"/><text class="t" x="104.0" y="725.0">Agent answer</text><text class="b" x="24" y="755.0">key-fact recall, unsupported claims,</text><text class="b" x="24" y="776.0">decision</text><rect class="nd" x="10" y="809.0" width="340" height="130.0" rx="12"/><text class="gl" x="24" y="841.0">7</text><use href="#judge" x="46.0" y="823.0" width="20" height="20"/><text class="t" x="74.0" y="839.0">Judge 2</text><path class="e r" d="M50.0 845.0 V859.0 H68.0" marker-end="url(#fl-grading-tall-a)"/><use href="#brief" x="76.0" y="851.0" width="20" height="20"/><text class="t" x="104.0" y="867.0">Agent answer</text><text class="b" x="24" y="897.0">independent labels, agreement</text><text class="b" x="24" y="918.0">recorded</text><rect class="nd q" x="10" y="951.0" width="340" height="66.0" rx="12"/><text class="b strong" x="24" y="980.0">Pass = right decision AND recall ≥</text><text class="b strong" x="24" y="1001.0">0.7 AND unsupported ≤ 0.25</text></svg>
