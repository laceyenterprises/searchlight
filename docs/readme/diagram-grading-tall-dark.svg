="12"/><text class="gl" x="26" y="506.0">4</text><use href="#judge" x="48.0" y="488.0" width="20" height="20"/><text class="t" x="76.0" y="504.0">Judge 1 and Judge 2</text><path class="e r" d="M52.0 510.0 V524.0 H70.0" marker-end="url(#fl-grading-readme-tall-a)"/><use href="#brief" x="78.0" y="516.0" width="20" height="20"/><text class="t" x="106.0" y="532.0">Agent answer</text><text class="b" x="26" y="562.0">key-fact recall, unsupported</text><text class="b" x="26" y="584.0">claims, decision; independent</text><text class="b" x="26" y="606.0">labels, agreement recorded</text><rect class="nd q" x="12" y="640.0" width="336" height="68.0" rx="12"/><text class="b strong" x="26" y="670.0">Pass = right decision AND recall ≥</text><text class="b strong" x="26" y="692.0">0.7 AND unsupported ≤ 0.25</text></svg>
