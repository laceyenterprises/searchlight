<svg xmlns="http://www.w3.org/2000/svg" class="tall" viewBox="0 0 400 926" width="400" height="926" role="img" aria-labelledby="t d"><style>:root{--paper:#0C0F13;--soft:#141920;--raised:#1B212A;--rule:#262C35;--ink:#F2F4F7;--ink-2:#B9C1CC;--muted:#939CAA;--blue:#3D9BFF;--blue-ink:#7DBBFF;--blue-soft:#0F2238;--on-blue:#06111F;--go:#2BD99A;--go-ink:#5BE3AE;--red:#FF4D4F;--red-ink:#FF8587;--amber:#FFC83D;--amber-ink:#FFD36B;--amber-soft:#2A2210;--night:#141920;--night-2:#1B212A;--night-rule:#2B323C;--night-fg:#F2F4F7;--night-mute:#9AA3AF;--sl-accent:var(--blue);--sl-go:var(--go);--sl-red:var(--red);--sl-amber:var(--amber);--viz-track:#1A2029;--viz-interval:#2A5D99;--viz-other:#56606D;--viz-ref:#B9C1CC;--font-body:Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;--font-display:Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;--font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;--space-9:80px;--radius-xs:3px;--radius-sm:6px;--radius-md:8px;--radius-lg:12px;--radius-xl:18px;--wrap:1120px;--font-body:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;--font-display:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;--font-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace}.nd{fill:var(--raised);stroke:var(--rule);stroke-width:1.5}.grp{fill:none;stroke:var(--viz-other);stroke-width:1.5;stroke-dasharray:6 6}.gl{font:500 14px var(--font-mono);letter-spacing:.06em;fill:var(--muted)}.t{font:650 17px var(--font-body);fill:var(--ink)}.b{font:400 16px var(--font-body);fill:var(--ink-2)}.tall .t{font-size:16px}.tall .b{font-size:15px}.e{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round}.ah{fill:var(--muted)}.el{font:500 15px var(--font-body);fill:var(--ink-2)}.elb{fill:var(--paper)}use{color:var(--ink)}use{color:var(--ink)}</style><defs><symbol id="agent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M6 10l3 2.5L6 15"/><path d="M11 15h6" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="built-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><rect x="2.5" y="4" width="19" height="16" rx="2"/><circle cx="11" cy="11.5" r="3.5" style="stroke:var(--sl-accent, currentColor)"/><path d="M13.6 14.1l3 3" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="no-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.18 15.18L20.18 20.18" /><path d="M3.5 3.5l17 17" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="provider" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M6.5 9.5h11v4a5.5 5.5 0 0 1-11 0zM12 19v3"/><path d="M9 3v6.5M15 3v6.5" style="stroke:var(--sl-accent, currentColor)"/></symbol><symbol id="source" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter"><path d="M5 2.5h10l4 4v15H5z"/><path d="M15 2.5v4h4"/><path d="M8.5 12h7" style="stroke:var(--sl-accent, currentColor)"/><path d="M8.5 16h7"/></symbol></defs><title id="t">Exactly one search setup per run</title><desc id="d">The same agent, the same prompt: Claude Code (claude-opus-5-5) or Codex (gpt-6.1) or Hermes Agent, Opencode or Pi on an OSS model. Each run gives it exactly one search setup: No search (memory alone), Built-in (the agent&#x27;s own), Brave (MCP server), Tavily (MCP server), Exa (MCP server), Parallel (hosted MCP), Firecrawl (MCP server), Perplexity (MCP server). The search gap bench adds two reference setups per task: floor, no search; ceiling, the answer excerpt in the prompt.</desc><defs><marker id="fl-setups-tall-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="nd " x="12.0" y="12.0" width="376.0" height="100.0" rx="12"/><use href="#agent" x="26.0" y="26.0" width="26" height="26"/><text class="t" x="62.0" y="45.0">The same agent, the same prompt</text><text class="b" x="26.0" y="75.0">Claude Code or Codex, or Hermes Agent,</text><text class="b" x="26.0" y="96.0">Opencode or Pi on an OSS model</text><path class="e" d="M200.0 112.0V166.0" marker-end="url(#fl-setups-tall-a)"/><rect class="elb" x="208.0" y="126.8" width="144.6" height="22.5" rx="4"/><text class="el" x="280.3" y="144.8" text-anchor="middle">only this changes</text><rect class="grp" x="12.0" y="168.0" width="376.0" height="520.0" rx="16"/><text class="gl" x="24.0" y="195.0">EXACTLY ONE PER RUN</text><rect class="nd " x="22.0" y="210.0" width="172.0" height="108.0" rx="12"/><use href="#no-search" x="36.0" y="224.0" width="26" height="26"/><text class="t" x="36.0" y="273.0">No search</text><text class="b" x="36.0" y="298.0">memory alone</text><rect class="nd " x="206.0" y="210.0" width="172.0" height="108.0" rx="12"/><use href="#built-in" x="220.0" y="224.0" width="26" height="26"/><text class="t" x="220.0" y="273.0">Built-in</text><text class="b" x="220.0" y="298.0">the agent&#x27;s own</text><rect class="nd " x="22.0" y="330.0" width="172.0" height="108.0" rx="12"/><use href="#provider" x="36.0" y="344.0" width="26" height="26"/><text class="t" x="36.0" y="393.0">Brave</text><text class="b" x="36.0" y="418.0">MCP server</text><rect class="nd " x="206.0" y="330.0" width="172.0" height="108.0" rx="12"/><use href="#provider" x="220.0" y="344.0" width="26" height="26"/><text class="t" x="220.0" y="393.0">Tavily</text><text class="b" x="220.0" y="418.0">MCP server</text><rect class="nd " x="22.0" y="450.0" width="172.0" height="108.0" rx="12"/><use href="#provider" x="36.0" y="464.0" width="26" height="26"/><text class="t" x="36.0" y="513.0">Exa</text><text class="b" x="36.0" y="538.0">MCP server</text><rect class="nd " x="206.0" y="450.0" width="172.0" height="108.0" rx="12"/><use href="#provider" x="220.0" y="464.0" width="26" height="26"/><text class="t" x="220.0" y="513.0">Parallel</text><text class="b" x="220.0" y="538.0">hosted MCP</text><rect class="nd " x="22.0" y="570.0" width="172.0" height="108.0" rx="12"/><use href="#provider" x="36.0" y="584.0" width="26" height="26"/><text class="t" x="36.0" y="633.0">Firecrawl</text><text class="b" x="36.0" y="658.0">MCP server</text><rect class="nd " x="206.0" y="570.0" width="172.0" height="108.0" rx="12"/><use href="#provider" x="220.0" y="584.0" width="26" height="26"/><text class="t" x="220.0" y="633.0">Perplexity</text><text class="b" x="220.0" y="658.0">MCP server</text><rect class="grp" x="12.0" y="712.0" width="376.0" height="202.0" rx="16"/><text class="gl" x="24.0" y="739.0">GAP BENCH ADDS</text><rect class="nd " x="22.0" y="754.0" width="172.0" height="150.0" rx="12"/><use href="#no-search" x="36.0" y="768.0" width="26" height="26"/><text class="t" x="36.0" y="817.0">Floor</text><text class="b" x="36.0" y="842.0">no search</text><rect class="nd " x="206.0" y="754.0" width="172.0" height="150.0" rx="12"/><use href="#source" x="220.0" y="768.0" width="26" height="26"/><text class="t" x="220.0" y="817.0">Ceiling</text><text class="b" x="220.0" y="842.0">the answer</text><text class="b" x="220.0" y="863.0">excerpt in the</text><text class="b" x="220.0" y="884.0">prompt</text></svg>
