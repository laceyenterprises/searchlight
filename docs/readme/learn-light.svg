 stroke-width="3" style="stroke:var(--sl-accent, currentColor)"/></symbol></defs><title id="t">Searchlight in 60 seconds</title><desc id="d">Agent: The AI coding agent doing the job: Claude Code or Codex. Search setup: The one thing that changes: a search provider, the agent&#x27;s built-in search, or none. Training cutoff: The date a model&#x27;s knowledge ends. Brief: A short research report that ends in a decision and cites its sources. Run: One task with one search setup, repeated three times. Blind grading: The grader never sees which setup produced the answer. 95% range: Where the true score most likely sits. Tie: Two ranges overlap, so the test cannot separate them.</desc><rect class="pn" width="840" height="476" rx="16"/><rect class="cd" x="20.0" y="20.0" width="191.0" height="234.0" rx="12"/><use href="#agent" x="36.0" y="36.0" width="32" height="32"/><text class="tn" x="36.0" y="100.0">Agent</text><text class="tb" x="36.0" y="126.0">The AI coding</text><text class="tb" x="36.0" y="148.0">agent doing the</text><text class="tb" x="36.0" y="170.0">job: Claude Code</text><text class="tb" x="36.0" y="192.0">or Codex.</text><rect class="cd" x="223.0" y="20.0" width="191.0" height="234.0" rx="12"/><use href="#setup" x="239.0" y="36.0" width="32" height="32"/><text class="tn" x="239.0" y="100.0">Search setup</text><text class="tb" x="239.0" y="126.0">The one thing</text><text class="tb" x="239.0" y="148.0">that changes: a</text><text class="tb" x="239.0" y="170.0">search provider,</text><text class="tb" x="239.0" y="192.0">the agent&#x27;s</text><text class="tb" x="239.0" y="214.0">built-in search,</text><text class="tb" x="239.0" y="236.0">or none.</text><rect class="cd" x="426.0" y="20.0" width="191.0" height="234.0" rx="12"/><use href="#cutoff" x="442.0" y="36.0" width="32" height="32"/><text class="tn" x="442.0" y="100.0">Training cutoff</text><text class="tb" x="442.0" y="126.0">The date a</text><text class="tb" x="442.0" y="148.0">model&#x27;s knowledge</tex