name: Standalone
on:
  # SEV0 2026-10-05 (Actions spend): per-PR CI is Linux-only. Push runs only on main
  # (PR branches were double-triggered by push + pull_request). macOS runs weekly or on demand.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
concurrency:
  # Keep Linux-only pushes from cancelling scheduled or manual macOS coverage.
  group: standalone-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        # macOS bills ~8x Linux on this private repo: only on schedule/workflow_dispatch.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      SEW_MODE: standalone
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      SEW_PUBLICATION_BATTERY: ${{ runner.os == 'Linux' && matrix.python == '3.12' && '1' || '0' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pull-request history
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Checkout's full history excludes closed/deleted PR branches. Supply
          # the read token for this command only; never persist it in git config.
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="$auth_header" git fetch --prune origin \
            '+refs/pull/*:refs/remotes/pull/*'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Provision Linux sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install public dependencies and local package
        run: python3 -m pip install '.[test]'
      - name: Lint
        run: |
          python3 scripts/lint.py
          python3 scripts/check_reports.py
          python3 scripts/build_site.py --check
          git diff --check
      - name: Installed standalone doctor
        run: sew doctor | tee doctor.txt && grep 'mode         standalone' doctor.txt
      - name: Portable hardcode denylist
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python3 scripts/publication-gates.py hardcodes
      - name: Retain historical topology visibility report
        if: runner.os == 'Linux' && matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-hardcode-history
          path: publication-hardcode-history.json
          if-no-files-found: error
      - name: Tree and full reachable history secret scan
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python3 scripts/publication-gates.py secrets
      - name: Permissive public dependency licences
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python3 scripts/publication-gates.py licences
      - name: Fresh installed clone suite without external network
        run: |
          if scripts/public-clone-proof.sh > "$RUNNER_TEMP/suite.log" 2>&1; then
            cat "$RUNNER_TEMP/suite.log"
          else
            cat "$RUNNER_TEMP/suite.log"
            python3 - "$RUNNER_TEMP/suite.log" <<'PYTHON'
          import sys
          for line in open(sys.argv[1]):
              if line.startswith(('E ', 'FAILED ', 'ERROR ')):
                  message = line.rstrip().replace('%', '%25').replace('\r', '%0D')
                  print(f'::error::{message}')
          PYTHON
            exit 1
          fi
