name: Pages

# Publishes site/ (leaderboard, infographic, run reports) whenever a report or the
# site builder changes on main. One small Linux job; no macOS minutes.
on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'site/**'
      - 'config/provider-arm-tools.yaml'
      - 'scripts/build_site.py'
      - 'scripts/check_reports.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reports and that the committed site is current
        run: |
          python3 -m pip install .
          python3 scripts/check_reports.py
          python3 scripts/build_site.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
